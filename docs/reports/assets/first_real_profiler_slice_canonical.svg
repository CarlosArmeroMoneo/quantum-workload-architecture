<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Canonical profiler-backed architecture snapshot for the real dense ring 6 batched run</title>
  <desc id="desc">Two-panel SVG showing measured NVTX phase shares and the primary launch overhead architecture nomination for the canonical OVH RTX 5000 batched run recorded on March 14, 2026.</desc>
  <style>
    .bg { fill: #f5f7fb; }
    .panel { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; }
    .panel-soft { fill: #fcfcfd; stroke: #eaecf0; stroke-width: 1; }
    .chip { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; }
    .title { fill: #101828; font: 700 32px "Segoe UI", Arial, sans-serif; }
    .subtitle { fill: #475467; font: 400 16px "Segoe UI", Arial, sans-serif; }
    .panel-title { fill: #101828; font: 700 22px "Segoe UI", Arial, sans-serif; }
    .panel-subtitle { fill: #667085; font: 400 14px "Segoe UI", Arial, sans-serif; }
    .label { fill: #344054; font: 600 15px "Segoe UI", Arial, sans-serif; }
    .body { fill: #101828; font: 600 18px "Segoe UI", Arial, sans-serif; }
    .body-small { fill: #475467; font: 400 14px "Segoe UI", Arial, sans-serif; }
    .metric { fill: #101828; font: 700 30px "Segoe UI", Arial, sans-serif; }
    .mono { fill: #344054; font: 500 13px Consolas, "Courier New", monospace; }
    .mono-strong { fill: #101828; font: 700 16px Consolas, "Courier New", monospace; }
    .track { stroke: #e4e7ec; stroke-width: 10; stroke-linecap: round; }
    .warm { stroke: #155eef; fill: #155eef; }
    .first { stroke: #53b1fd; fill: #53b1fd; }
    .convert { stroke: #f79009; fill: #f79009; }
    .path { stroke: #12b76a; fill: #12b76a; }
    .load { stroke: #667085; fill: #667085; }
    .post { stroke: #d92d20; fill: #d92d20; }
    .accent { fill: #eff8ff; stroke: #b2ddff; stroke-width: 1; }
    .accent-warm { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1; }
    .accent-green { fill: #ecfdf3; stroke: #abefc6; stroke-width: 1; }
    .pill { fill: #101828; }
    .pill-text { fill: #ffffff; font: 700 16px Consolas, "Courier New", monospace; }
  </style>

  <rect class="bg" x="10" y="10" width="1180" height="700" rx="28" />

  <text class="title" x="48" y="64">Canonical Profiler Slice</text>
  <text class="subtitle" x="48" y="92">March 14, 2026  |  OVH RTX 5000  |  real_dense_ring6_batched</text>

  <g>
    <rect class="chip" x="48" y="112" width="176" height="46" rx="14" />
    <text class="body-small" x="64" y="131">Canonical host</text>
    <text class="mono-strong" x="64" y="150">OVH RTX 5000</text>

    <rect class="chip" x="238" y="112" width="144" height="46" rx="14" />
    <text class="body-small" x="254" y="131">TTFR</text>
    <text class="mono-strong" x="254" y="150">1.042 s</text>

    <rect class="chip" x="396" y="112" width="144" height="46" rx="14" />
    <text class="body-small" x="412" y="131">Wall</text>
    <text class="mono-strong" x="412" y="150">2.231 s</text>

    <rect class="chip" x="554" y="112" width="194" height="46" rx="14" />
    <text class="body-small" x="570" y="131">repeat_count_hint</text>
    <text class="mono-strong" x="570" y="150">12</text>

    <rect class="chip" x="762" y="112" width="242" height="46" rx="14" />
    <text class="body-small" x="778" y="131">Profiled phase budget</text>
    <text class="mono-strong" x="778" y="150">1.677921 s</text>
  </g>

  <rect class="panel" x="40" y="178" width="548" height="492" rx="24" />
  <rect class="panel" x="612" y="178" width="548" height="492" rx="24" />

  <g>
    <text class="panel-title" x="72" y="218">Measured phase share</text>
    <text class="panel-subtitle" x="72" y="242">Normalized from the canonical batched execution phase timings.</text>

    <rect class="panel-soft" x="72" y="258" width="484" height="52" rx="14" />
    <rect class="warm" x="88" y="276" width="196.81" height="16" rx="8" />
    <rect class="first" x="284.81" y="276" width="123.52" height="16" />
    <rect class="convert" x="408.33" y="276" width="91.52" height="16" />
    <rect class="path" x="499.85" y="276" width="7.90" height="16" />
    <rect class="load" x="507.75" y="276" width="0.17" height="16" />
    <rect class="post" x="507.92" y="276" width="0.13" height="16" />
    <text class="body-small" x="88" y="335">Setup phases total 21.86% of the profiled slice.</text>

    <text class="label" x="72" y="374">contract_warm</text>
    <text class="body-small" x="72" y="393">786.20 ms</text>
    <line class="track" x1="240" y1="377" x2="480" y2="377" />
    <line class="warm" x1="240" y1="377" x2="480" y2="377" stroke-width="10" stroke-linecap="round" />
    <text class="mono-strong" x="496" y="382">46.86%</text>

    <text class="label" x="72" y="429">contract_first</text>
    <text class="body-small" x="72" y="448">493.47 ms</text>
    <line class="track" x1="240" y1="432" x2="480" y2="432" />
    <line class="first" x1="240" y1="432" x2="390.55" y2="432" stroke-width="10" stroke-linecap="round" />
    <text class="mono-strong" x="496" y="437">29.41%</text>

    <text class="label" x="72" y="484">convert_to_einsum</text>
    <text class="body-small" x="72" y="503">365.59 ms</text>
    <line class="track" x1="240" y1="487" x2="480" y2="487" />
    <line class="convert" x1="240" y1="487" x2="351.59" y2="487" stroke-width="10" stroke-linecap="round" />
    <text class="mono-strong" x="496" y="492">21.79%</text>

    <text class="label" x="72" y="539">contract_path</text>
    <text class="body-small" x="72" y="558">31.47 ms</text>
    <line class="track" x1="240" y1="542" x2="480" y2="542" />
    <line class="path" x1="240" y1="542" x2="249.62" y2="542" stroke-width="10" stroke-linecap="round" />
    <text class="mono-strong" x="496" y="547">1.88%</text>

    <text class="label" x="72" y="594">load_circuit</text>
    <text class="body-small" x="72" y="613">0.68 ms</text>
    <line class="track" x1="240" y1="597" x2="480" y2="597" />
    <line class="load" x1="240" y1="597" x2="240.20" y2="597" stroke-width="10" stroke-linecap="round" />
    <text class="mono-strong" x="496" y="602">0.04%</text>

    <text class="label" x="72" y="649">postprocess</text>
    <text class="body-small" x="72" y="668">0.51 ms</text>
    <line class="track" x1="240" y1="652" x2="480" y2="652" />
    <line class="post" x1="240" y1="652" x2="240.15" y2="652" stroke-width="10" stroke-linecap="round" />
    <text class="mono-strong" x="496" y="657">0.03%</text>
  </g>

  <g>
    <text class="panel-title" x="644" y="218">Architecture nomination</text>
    <text class="panel-subtitle" x="644" y="242">Primary nomination from the matching architecture output.</text>

    <rect class="pill" x="644" y="258" width="208" height="40" rx="20" />
    <text class="pill-text" x="666" y="283">launch_overhead</text>

    <rect class="accent" x="644" y="320" width="238" height="92" rx="18" />
    <text class="body-small" x="664" y="346">nomination_source</text>
    <text class="mono-strong" x="664" y="370">real_profiler_analysis</text>
    <text class="body-small" x="664" y="394">selected_mode</text>
    <text class="mono-strong" x="664" y="410">exact_tn</text>

    <rect class="accent-warm" x="898" y="320" width="230" height="92" rx="18" />
    <text class="body-small" x="918" y="346">severity_score</text>
    <text class="metric" x="918" y="385">0.40</text>
    <text class="body-small" x="918" y="408">rounded from 0.397442</text>

    <rect class="panel-soft" x="644" y="434" width="484" height="116" rx="18" />
    <text class="label" x="664" y="462">Why it was nominated</text>
    <text class="body" x="664" y="490">Load, convert, and postprocess work takes</text>
    <text class="body" x="664" y="514">21.86% of the profiled batched run.</text>
    <text class="body-small" x="664" y="538">setup_time_s = 0.366781632</text>

    <rect class="accent-green" x="644" y="570" width="484" height="74" rx="18" />
    <text class="label" x="664" y="598">Counterfactual sweep</text>
    <text class="mono" x="664" y="620">orchestration_overhead_multiplier</text>
    <text class="mono-strong" x="664" y="636">1.0x  -&gt;  0.75x  -&gt;  0.5x</text>
  </g>
</svg>
