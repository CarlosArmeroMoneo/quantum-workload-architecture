    - nsys smoke is fully working on this host
    - ncu smoke is intentionally unfiltered on this host/toolchain to avoid brittle NVTX filter behavior
    - real exact-TN execution on this host uses the .venv_cu13 environment plus qwa_cuda_env_cu13.sh
    - container runtime inventory is recorded here, but the canonical first slice ran directly on the host in .venv_cu13
    - real profiler-backed architecture analysis was successfully produced on this host
    - if the host changes materially, create a new manifest rather than editing this file in place

