api_version: aqs.system.v1
system_name: linux_profiler_node_template
node_label: fill_me_with_host_label
gpu_model: NVIDIA H100 80GB HBM3
gpu_count: 1
gpu_mem_gb: 80
gpu_arch_target: sm90
ram_gb: 512
interconnect: pcie
os_release: Ubuntu 24.04 LTS
kernel_version: 6.8.0-generic
driver_version: "570.xx"
container_runtime:
  kind: docker
  version: "27.x"
appliance_image:
  ref: nvcr.io/nvidia/cuquantum-appliance:25.11-x86_64@sha256:fill_me_in
  base_ref: optional_if_using_a_local_layered_image
profiling_host:
  canonical_tool_source:
    nsys: container_bundled
    qdstrm_importer: container_bundled
    ncu: container_bundled
  tool_paths:
    nsys: /opt/nvidia/nsight-compute/<version>/host/target-linux-x64/nsys
    qdstrm_importer: /opt/nvidia/nsight-compute/<version>/host/linux-desktop-glibc_2_11_3-x64/QdstrmImporter
    ncu: /usr/local/cuda/bin/ncu
  nsys_version: NVIDIA Nsight Systems version 2025.3.1.0
  qdstrm_importer_version: QdstrmImporter version 2025.3.1.0 or unavailable_with_recorded_probe_error
  qdstrm_importer_version_probe_error: null
  ncu_version: Version 2025.3.1.0
  gpu_performance_counters: enabled_or_blocked_on_host_policy
  container_launch:
    user: cuquantum
    uid: 1000
    gid: 1000
    gpu_access: --gpus all
    cap_add: []
    privileged: false
    workspace_mount: /host/workspace:/workspace
  elevated_probe_attempt:
    user: root
    cap_add:
      - SYS_ADMIN
    privileged: false
    result: optional_if_tested
  readiness_artifact: configs/systems/<host_slug>.profiling_ready.json
  session_log: docs/runbooks/profiler_<host_slug>_session.md
  notes:
    - freeze this file before collecting real profiler-backed benchmark evidence
    - keep profiler collection and importer tooling on the same blessed source
    - if the host changes materially, create a new manifest instead of editing in place
notes: template for the first profiling-capable Linux host used for real exact-TN profiler-backed runs
